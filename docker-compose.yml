services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: josefina-backend

    ports:
      - "8000:8000"

    env_file:
      - .env

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: josefina-frontend

    ports:
      - "3000:3000"

    depends_on:
      - backend

    restart: unless-stopped